[proxy]
proxy_enabled = 0

[logging]
agent = INFO


[performance_tuning_settings]
worker_threads_num = 10
query_entities_page_size = 1000
event_cnt_per_item = 100
query_end_time_offset = 180
get_blob_batch_size = 120000
http_timeout = 120
skip_files_monitoring_for_restart = 0
event_hub_watchdog_enabled = 1
load_balancing_strategy = balanced
max_attempts = 12
